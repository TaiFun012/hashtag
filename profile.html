<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Хештег</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

        <header class="header">
            <div class="logo">
                <img src="./Assets/logo.svg" alt="Логотип" class="logo-img">
            </div>
            
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="profile.html" class="nav-link active">Профиль</a>
                <a href="map.html" class="nav-link">Карта локаций</a>
            </nav>

            <div class="auth-actions">
                <button id="btn-logout" class="btn btn-outline">Выйти</button>
                <a href="map.html" class="btn btn-primary">Добавить локацию</a>
            </div>
        </header>

    <div class="container">
        <main class="profile-page">
            <h1 class="page-title">Ваш профиль</h1>

            <div class="profile-grid">
                <section class="profile-info">
                    <div class="avatar-wrapper">
                        <img src="./Assets/P7220369.JPG" alt="Аватар" class="avatar-img">
                    </div>
                    
                    <h2 class="user-nickname">TaiFun1</h2>
                    <p class="user-fullname">Кудрявцев Владислав Александрович</p>
                    <p class="user-status">Вы с нами уже 6 месяцев!</p>

                    <div class="stats-card">
                        <div class="stat-item">
                            <span class="stat-label">Добавлено локаций:</span>
                            <span class="stat-number" id="added-locations">12</span>
                        </div>
                    </div>

                    <a href="map.html" class="btn btn-primary btn-full">Открыть карту</a>
                </section>

                <section class="profile-gallery">
                    <h2 class="gallery-title">Галерея ваших работ</h2>

                    <div class="gallery-grid" id="gallery-grid"></div>

                    <input type="file" id="photo-input" accept="image/*" multiple hidden>
                    <button class="btn btn-primary btn-full" id="add-photo-btn">Добавить фото</button>
                </section>
            </div>
        </main>
    </div>

    <footer class="footer">
            <div class="footer-logo">
                <img src="./Assets/logo.svg" alt="Логотип" class="logo-img">
            </div>
            <p class="copyright">© 2026 Хештег. База геоточек для фотографов. Все права защищены.</p>
            <div class="socials">
                <a href="#" class="social-link"><img src="./Assets/vk.svg" alt="VK"></a>
                <a href="#" class="social-link"><img src="./Assets/rutube.svg" alt="rutube"></a>
                <a href="#" class="social-link"><img src="./Assets/max-messenger.svg" alt="max"></a>
            </div>
        </footer>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" type="button">&times;</button>
        <img src="" alt="Просмотр фото" id="lightbox-img">
    </div>

    <script>
        const isLoggedIn = localStorage.getItem('hashtag_logged_in') === 'true';
        if (!isLoggedIn) {
            window.location.href = 'index.html';
        }

        let locs;
        try {
            locs = JSON.parse(localStorage.getItem('hashtags_locations'));
        } catch (e) {
            locs = null;
        }
        const myCount = Array.isArray(locs) ? locs.filter(p => p.mine).length : 0;

        const el = document.getElementById('added-locations');
        if (el) {
            el.textContent = myCount;
        }

        const logoutBtn = document.getElementById('btn-logout');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('hashtag_logged_in');
                window.location.href = 'index.html';
            });
        }

        const GALLERY_KEY = 'hashtags_photos';

        const DEFAULT_PHOTOS = [
            './Assets/P6170147.JPG',
            './Assets/PA030490.JPG',
            './Assets/P9110280.JPG',
            './Assets/P8310186.JPG'
        ];

        function loadPhotos() {
            try {
                const raw = JSON.parse(localStorage.getItem(GALLERY_KEY));
                if (Array.isArray(raw)) return raw;
            } catch (e) {}
            return DEFAULT_PHOTOS.map(path => ({ id: 'def-' + path, data: path }));
        }

        function savePhotos() {
            try {
                localStorage.setItem(GALLERY_KEY, JSON.stringify(photos));
            } catch (e) {
                alert('Не удалось сохранить фото: хранилище переполнено. Удали старые фото и попробуй снова.');
            }
        }

        const photos = loadPhotos();
        const galleryGrid = document.getElementById('gallery-grid');
        const photoInput = document.getElementById('photo-input');
        const addPhotoBtn = document.getElementById('add-photo-btn');

        function renderGallery() {
            galleryGrid.innerHTML = '';

            if (photos.length === 0) {
                galleryGrid.innerHTML = '<p class="gallery-empty">Пока нет фотографий. Нажми «Добавить фото».</p>';
                return;
            }

            photos.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML =
                    `<img src="${photo.data}" alt="Фото" loading="lazy">` +
                    `<button class="photo-delete" title="Удалить фото">&times;</button>`;

                item.querySelector('.photo-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('Удалить это фото?')) {
                        const idx = photos.indexOf(photo);
                        photos.splice(idx, 1);
                        savePhotos();
                        renderGallery();
                    }
                });

                item.addEventListener('click', () => openLightbox(photo.data));
                galleryGrid.appendChild(item);
            });
        }

        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX || height > MAX) {
                            const k = Math.min(MAX / width, MAX / height);
                            width = Math.round(width * k);
                            height = Math.round(height * k);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        addPhotoBtn.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', async () => {
            for (const file of photoInput.files) {
                if (!file.type.startsWith('image/')) continue;
                const dataUrl = await resizeImage(file);
                photos.push({ id: 'photo-' + Date.now() + '-' + Math.random(), data: dataUrl });
            }
            photoInput.value = '';
            savePhotos();
            renderGallery();
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
        }

        lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightbox.classList.remove('active');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') lightbox.classList.remove('active');
        });

        renderGallery();
    </script>
</body>
</html>
